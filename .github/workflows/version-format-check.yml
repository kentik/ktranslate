name: Version format check

# Validates that the checked-in VERSION file is a valid SemVer string, via `just
# check-version` in the Justfile -- the actual rule lives there (and is runnable
# identically with `nix develop --command just check-version` locally), this workflow is
# just the CI trigger around it. Same pattern as vendor-hash-check.yml.
#
# Always goes through `nix develop` (never a bare `nix run nixpkgs#just`/`nix run
# nixpkgs#semver-tool`): the latter resolves against whatever nixpkgs the *global* flake
# registry currently points at, not this repo's own pinned nixpkgs input, silently
# defeating flake.lock's version pin.
#
# cut-prerelease.yml and push-adhoc-image.yml's checks validate the same way, via `just
# check-semver`/`check-adhoc-tag` -- all of these defer to semver-tool
# (fsaintjacques/semver-tool) rather than a homegrown regex.
#
# Also enforces this repo's release model on VERSION specifically (stricter than "is this
# a valid SemVer string"): no prerelease suffix, and it must strictly increase over
# whatever it's replacing. The commit that bumps VERSION is the exact commit
# cut-prerelease.yml tags and pre-releases, so catching a bad bump here, at PR review time,
# is cheaper than catching it after that workflow has already acted on it.
#
# The paths filter below also watches Justfile: that's where check-version/check-semver/
# check-version-increment actually live now, so a change there can change what "valid" means
# just as much as a change to VERSION itself can. (It used to watch flake.nix/flake.lock
# instead, from when the SemVer check was a Nix check living in flake.nix -- stale since that
# moved to the Justfile. Add scripts/*.sh here too once that logic finishes moving into
# standalone scripts.)
#
# For the same reason, a PR that touches VERSION must touch *only* VERSION: since the
# bumping commit is exactly what gets tagged and released, letting other changes ride along
# would mean a release is never just "the previous release plus a version bump" -- it'd
# quietly include whatever else happened to be in that PR too, reviewed as "a version bump"
# rather than as the actual code change it is. See "Verify a VERSION bump is isolated" below.

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths: &version-paths
      - 'VERSION'
      - 'Justfile'
  pull_request:
    # Explicit types, not the default (opened/synchronize/reopened): a PR's base branch can
    # change without a new commit -- e.g. GitHub auto-retargeting a stacked PR onto main once
    # its original base branch merges and gets deleted -- and that's an `edited` event, which
    # the default types don't cover. Without it, the isolation/increment checks below can be
    # left showing a stale "pass" from before the retarget, against a diff that no longer
    # reflects what the PR would actually merge as.
    types: [opened, synchronize, reopened, edited]
    paths: *version-paths

permissions:
  contents: read
  pull-requests: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0 # need history to diff VERSION against its pre-change state below

      # Asks GitHub directly for the PR's actual file list (computed off the real
      # merge-base) rather than diffing local refs -- a local diff against the freshly
      # fetched base tip below would be misleading here if main has advanced with unrelated
      # commits since this PR branched, since that'd show up as "other files changed" too.
      - name: Verify a VERSION bump is isolated
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          FILES="$(gh api "repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/files" --paginate -q '.[].filename')"

          if ! grep -qxF 'VERSION' <<< "$FILES"; then
            echo "This PR doesn't touch VERSION (triggered by Justfile instead) -- nothing to isolate."
            exit 0
          fi

          OTHER="$(grep -vxF 'VERSION' <<< "$FILES" || true)"
          if [ -n "$OTHER" ]; then
            echo "::error::This PR bumps VERSION alongside other file changes. The commit that bumps VERSION is the exact commit cut-prerelease.yml tags and releases (see docs/RELEASING.md) -- it must touch VERSION only, so a release is never a bundle of unrelated, less-scrutinized changes. Split the other changes into a separate PR."
            echo "Other files changed:" >&2
            echo "$OTHER" | sed 's/^/  /' >&2
            exit 1
          fi
          echo "VERSION bump is isolated -- no other files changed."

      - name: Install Nix
        uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31

      - name: Nix build cache
        uses: Mic92/hestia@f1f4df2801140a36398ed423533c8460618539df # v3.0.1
        with:
          upstream-cache-filter: "true"

      - name: Validate VERSION is SemVer
        run: nix develop --command just check-version

      - name: Validate VERSION is a bare, incremented release version
        if: github.event_name != 'workflow_dispatch'
        env:
          PUSH_BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail
          NEW="$(tr -d '[:space:]' < VERSION)"

          case "$NEW" in
            *-*)
              echo "::error::VERSION ('$NEW') has a prerelease suffix. This repo's release model never checks one in -- the commit that bumps VERSION is itself the commit that gets tagged and pre-released (see cut-prerelease.yml). Bump to a bare MAJOR.MINOR.PATCH instead."
              exit 1
              ;;
          esac

          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            # Fetches the base branch's actual current tip rather than trusting
            # github.event.pull_request.base.sha: that field can be stale relative to
            # main's real state when this run was triggered by something other than a
            # fresh sync of this exact PR against the current base -- e.g. this
            # workflow's own paths filter matching Justfile on a push that landed well
            # after main last advanced. Comparing against a stale base previously
            # produced a false "VERSION decreased" failure.
            git fetch --depth 1 origin "$GITHUB_BASE_REF"
            OLD="$(git show "origin/$GITHUB_BASE_REF:VERSION" 2>/dev/null | tr -d '[:space:]' || true)"
          elif [ -n "${PUSH_BEFORE_SHA:-}" ] && git cat-file -e "$PUSH_BEFORE_SHA" 2>/dev/null; then
            # push: github.event.before is exactly this ref's state immediately before
            # this push, which is what we want -- no equivalent staleness risk here.
            OLD="$(git show "$PUSH_BEFORE_SHA:VERSION" 2>/dev/null | tr -d '[:space:]' || true)"
          else
            OLD=""
          fi

          if [ -z "$OLD" ] || [ "$OLD" = "$NEW" ]; then
            echo "VERSION unchanged (or no usable previous state to compare against) -- skipping the increment check."
            exit 0
          fi

          nix develop --command just check-version-increment "$OLD" "$NEW"
