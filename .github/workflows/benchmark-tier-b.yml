name: Benchmark (Tier B)

# The synthetic SNMP device farm (docs/BENCHMARKING_PLAN.md #2.2) that drives the real
# Discover() code path (pkg/inputs/snmp/disco.go) against real respond/reject/drop
# network behavior via a NixOS VM test -- see nix/tests/snmp-discovery-bench.nix.
#
# runs-on ubuntu-latest is already x86_64-linux, so the VM test runs its qemu process
# natively via kvm right there -- no apple-virt/HVF or linux-builder cross-system
# dispatch involved at all (that's specific to running this locally from Apple
# Silicon; see nix/tests/snmp-discovery-bench.nix's header comment for why).
#
# Runs on pull_request (path-filtered, mirroring benchmark.yml's Tier A pattern) so a
# PR touching discovery code gets a real before/after comparison as a sticky comment
# -- plus workflow_dispatch and a nightly schedule for drift tracking outside any PR.
# The ~7+ minutes this adds to matching PRs (VM boot included) is deliberately paid
# only on PRs that plausibly change the behavior being measured, not every PR.

on:
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * *' # nightly, off-the-hour to avoid the GitHub Actions top-of-hour crunch
  push:
    branches: [ main ]
    paths: &benchmark-tier-b-paths
      - 'pkg/inputs/snmp/**'
      - 'nix/tests/**'
      - 'benchmarks/tier-b-baseline.json'
      - '.github/workflows/benchmark-tier-b.yml'
      - 'flake.nix'
      - 'flake.lock'
  pull_request:
    paths: *benchmark-tier-b-paths

permissions:
  contents: read
  pull-requests: write # needed for the sticky PR comment

jobs:
  tier-b:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install Nix
        uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31
        with:
          # Exposes /dev/kvm in the runner -- required for the NixOS VM test's
          # requiredSystemFeatures (kvm, nixos-test). GitHub's hosted Linux runners
          # support nested virtualization for exactly this.
          enable_kvm: true

      # GitHub Actions cache-backed Nix substituter (see benchmark.yml).
      # This VM test builds the network-agent package itself plus its NixOS test
      # driver closure on every run -- caching those turns a rebuild into a pull
      # whenever this workflow's own inputs (see paths, above) haven't changed
      # what needs building.
      - name: Nix build cache
        uses: Mic92/hestia@f1f4df2801140a36398ed423533c8460618539df # v3.0.1
        with:
          upstream-cache-filter: "true"

      - name: Run Tier B and capture the result
        run: |
          # -ci (8 nodes), not the 40-node/70-20-10 target: confirmed via a real run
          # that even 12 concurrent VMs overwhelm a standard 4-vCPU runner within the
          # NixOS test driver's hardcoded 5-minute boot-shell timeout -- see
          # flake.nix's snmp-discovery-bench-ci comment.
          out="$(nix build .#checks.x86_64-linux.snmp-discovery-bench-ci -L --print-out-paths --no-link)"
          # $out/result.json is a directory, not a file: the test script's
          # collector.copy_from_machine("/tmp/result.json", "result.json") nests the
          # copied file one level deeper as result.json/result.json -- confirmed by
          # the same shape in local runs, not a CI-only quirk.
          cp "$out/result.json/result.json" /tmp/new.json

      - name: Compare against baseline
        run: |
          {
            echo "## Tier B run (8-node CI scale)"
            echo
            echo "| metric | baseline | this run | delta |"
            echo "|---|---|---|---|"
            base_elapsed="$(jq '.elapsed_s' benchmarks/tier-b-baseline.json)"
            new_elapsed="$(jq '.elapsed_s' /tmp/new.json)"
            pct="$(awk -v b="$base_elapsed" -v n="$new_elapsed" 'BEGIN { printf "%+.1f%%", ((n - b) / b) * 100 }')"
            printf '| elapsed_s | %.1f | %.1f | %s |\n' "$base_elapsed" "$new_elapsed" "$pct"
            base_devices="$(jq -r '.device_count' benchmarks/tier-b-baseline.json)"
            new_devices="$(jq -r '.device_count' /tmp/new.json)"
            devices_delta="—"
            [ "$base_devices" != "$new_devices" ] && devices_delta="**changed**"
            echo "| device_count | $base_devices | $new_devices | $devices_delta |"
            base_nodes="$(jq '.node_count' benchmarks/tier-b-baseline.json)"
            new_nodes="$(jq '.node_count' /tmp/new.json)"
            echo "| node_count | $base_nodes | $new_nodes | $([ "$base_nodes" = "$new_nodes" ] && echo "—" || echo "**changed**") |"
            echo
            echo "Single-run numbers, not a statistical distribution -- expect more"
            echo "run-to-run variance than Tier A's benchstat comparisons (real VM"
            echo "boot/scheduler jitter, not synthetic). Refresh"
            echo "\`benchmarks/tier-b-baseline.json\` from a real CI run's result, not a"
            echo "local one -- see docs/BENCHMARKING_PLAN.md #3."
          } | tee /tmp/report.md >> "$GITHUB_STEP_SUMMARY"

      - name: Comment on PR
        if: github.event_name == 'pull_request'
        uses: marocchino/sticky-pull-request-comment@773744901bac0e8cbb5a0dc842800d45e9b2b405 # v2
        with:
          header: tier-b-benchmark
          path: /tmp/report.md

      - name: Upload result
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: tier-b-result-${{ github.run_id }}
          path: /tmp/new.json
          retention-days: 90
          if-no-files-found: error
