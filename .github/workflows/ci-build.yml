name: CI Build (no push)

# Validation build: confirms the Docker image builds end-to-end (which also compiles
# the Go binary via `make`) for the given platform. It is NEVER pushed to a registry,
# and the resulting image never leaves the runner -- for an actual runnable image, use
# publish-release.yml's workflow_dispatch instead.

on:
  push:
    branches: [ develop ]
  pull_request:
  workflow_dispatch:
    inputs:
      platform:
        description: Target platform to validate the build against
        type: choice
        options:
          - linux/amd64
          - linux/arm64
        default: linux/amd64

jobs:
  docker-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set build id and platform
        run: |
          echo "CI_BUILD=ci-$(date +%Y-%m-%d)-${GITHUB_RUN_ID}" >> "$GITHUB_ENV"
          echo "PLATFORM=${{ github.event.inputs.platform || 'linux/amd64' }}" >> "$GITHUB_ENV"

      - name: Set up QEMU        # enables cross-building (e.g. arm64 on an amd64 runner)
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      # A BuildKit `--mount=type=cache` (what this used to use) doesn't survive across CI
      # runs -- each job gets a fresh BuildKit daemon, and cache mounts aren't included in
      # `--cache-from`/`--cache-to` exports either. actions/cache is the thing that actually
      # persists across runs, so the download happens here, once per calendar day, and the
      # Dockerfile's maxmind stage just COPYs the result from the build context.
      #
      # This cache is scoped to this PR alone -- see warm-maxmind-cache.yml for the daily
      # job on main that every other branch/PR falls back to instead of hitting MaxMind
      # independently. restore-keys is a second fallback layer on top of that: the exact
      # key rolls over at UTC midnight, but that daily job only fires shortly after --
      # if a build lands in the few minutes between the two, or that job has a bad day,
      # this still restores whatever the most recent prior day's cache was rather than
      # ever falling through to MaxMind. Slightly stale GeoLite2 data is a non-issue;
      # a build that can't get the data at all is not.
      - name: Cache key date
        id: date
        run: echo "date=$(date +%Y-%m-%d)" >> "$GITHUB_OUTPUT"

      - name: Cache MaxMind databases
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: maxmind-dbs
          key: maxmind-dbs-${{ steps.date.outputs.date }}
          restore-keys: |
            maxmind-dbs-

      - name: Download MaxMind databases
        env:
          MM_ACCOUNT_ID: ${{ secrets.MM_ACCOUNT_ID }}
          MM_DOWNLOAD_KEY: ${{ secrets.MM_DOWNLOAD_KEY }}
        run: |
          set -eu
          if [ -f maxmind-dbs/GeoLite2-Country.mmdb ] && [ -f maxmind-dbs/GeoLite2-ASN.mmdb ]; then
            echo "Using cached MaxMind databases (exact match or restore-keys fallback)"
            exit 0
          fi
          if [ -z "$MM_DOWNLOAD_KEY" ]; then echo "maxmind license key secret (MM_DOWNLOAD_KEY) not provided"; exit 1; fi
          mkdir -p maxmind-dbs
          curl -sfL -o /tmp/country.tar.gz -u "$MM_ACCOUNT_ID:$MM_DOWNLOAD_KEY" "https://download.maxmind.com/geoip/databases/GeoLite2-Country/download?suffix=tar.gz"
          tar zxf /tmp/country.tar.gz --strip-components 1 -C maxmind-dbs
          curl -sfL -o /tmp/asn.tar.gz -u "$MM_ACCOUNT_ID:$MM_DOWNLOAD_KEY" "https://download.maxmind.com/geoip/databases/GeoLite2-ASN/download?suffix=tar.gz"
          tar zxf /tmp/asn.tar.gz --strip-components 1 -C maxmind-dbs

      - name: Build image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          platforms: ${{ env.PLATFORM }}
          tags: network-agent:ci
          # Loads the built image into the runner's local Docker daemon (same as
          # `docker buildx build --load`) so the verification step below can run it --
          # nothing is exported to a file or pushed anywhere. type=docker is
          # single-platform, which is why the platform is fixed per run.
          outputs: type=docker
          # No NETWORK_AGENT_VERSION here -- Make's own default (the VERSION file) stands,
          # same as any other build. NETWORK_AGENT_BUILD identifies this specific CI run.
          build-args: |
            NETWORK_AGENT_BUILD=${{ env.CI_BUILD }}
            NR_SNMP_PROFILE_REPO=https://github.com/newrelic-forks/snmp-profiles
          # All credentials are BuildKit secrets (never build-args) so they cannot leak
          # into logs/layers even on a failed step.
          secrets: |
            github_token=${{ secrets.SNMP_PROFILES_TOKEN }}

      # Sanity-checks the built image runs and has the expected content, so a missing
      # or misplaced file fails CI loudly instead of only surfacing at release time.
      - name: Verify third-party notices are present in the image
        run: |
          docker run --rm --entrypoint cat network-agent:ci /usr/share/doc/ktranslate/THIRD_PARTY_NOTICES.md | head -5
